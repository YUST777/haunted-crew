<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Haunted Crew</title>
<style>
  :root {
    --bg: #0e0a16; --panel: #150f21; --card: #1b1429; --line: #2a2140; --text: #ece8f4; --dim: #8e84a6; --faint: #5e5675;
    --accent: #8b5cf6; --pumpkin: #ff9a3c; --ok: #4ade80; --warn: #ffc94d; --bad: #ff6b6b; --work: #5aa9ff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 ui-monospace, "JetBrains Mono", Menlo, Consolas, monospace; }
  header { display: flex; align-items: center; gap: 16px; padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--panel); }
  .logo { color: var(--pumpkin); font-weight: 700; font-size: 16px; display: flex; align-items: center; gap: 8px; }
  .ghost { width: 22px; height: 22px; border-radius: 5px; display: inline-grid; place-items: center; flex: none; }
  .ghost::before { content: ""; width: 60%; height: 64%; background: #f2f0ff; border-radius: 2px; box-shadow: inset 3px -3px 0 -1px transparent; }
  .stats { display: flex; gap: 10px; margin-left: auto; flex-wrap: wrap; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px; color: var(--dim); }
  .stat b { color: var(--text); }
  .conn { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; background: var(--faint); }
  main { display: grid; grid-template-columns: 280px 1fr 300px; gap: 16px; padding: 16px 20px; height: calc(100vh - 58px); }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; min-height: 0; }
  h2 { margin: 0; padding: 12px 14px; font-size: 12px; letter-spacing: .08em; color: var(--faint); border-bottom: 1px solid var(--line); }
  .scroll { overflow-y: auto; padding: 8px; flex: 1; }
  .crew { display: flex; gap: 10px; padding: 9px; border-radius: 9px; cursor: pointer; align-items: center; }
  .crew:hover { background: #1a1428; }
  .crew.sel { background: #241b38; box-shadow: inset 2px 0 0 var(--pumpkin); }
  .crew .name { font-weight: 700; }
  .crew .act { color: var(--dim); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 190px; }
  .dot { width: 8px; height: 8px; border-radius: 2px; flex: none; margin-left: auto; }
  .feed .row { display: grid; grid-template-columns: 52px 110px 1fr; gap: 10px; padding: 4px 8px; border-radius: 6px; }
  .feed .row:hover { background: #1a1428; }
  .time { color: var(--faint); }
  .who { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .msg { white-space: pre-wrap; word-break: break-word; }
  .k-message .msg { color: #fff; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; }
  .k-prompt .msg { color: #cdb4ff; }
  .k-error .msg, .k-fail .msg { color: var(--bad); }
  .k-permission .msg, .k-stop .msg { color: var(--warn); }
  .k-task_end .msg { color: var(--ok); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }
  .card.need { border-color: #b8862a; background: #241c10; }
  .empty { color: var(--faint); padding: 14px; }
  .tasks li { list-style: none; padding: 4px 0; color: var(--dim); }
  .tasks li.done { color: var(--ok); }
  .tasks ul { margin: 0; padding: 0; }
  #auth { max-width: 520px; margin: 12vh auto; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 24px; }
  #auth input { width: 100%; padding: 10px; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 8px; font: inherit; }
  #auth button { margin-top: 12px; background: var(--accent); color: white; border: 0; border-radius: 8px; padding: 9px 16px; font: inherit; cursor: pointer; }
  @media (max-width: 1000px) { main { grid-template-columns: 1fr; height: auto; } section { max-height: 60vh; } }
</style>
</head>
<body>
<div id="auth" hidden>
  <div class="logo"><span class="ghost" style="background:#7b4fc0"></span>Haunted Crew</div>
  <p>Paste the dashboard link the launcher printed, or the <b>view</b> token from <code>~/.haunted-crew/tokens.json</code>.</p>
  <input id="tok" placeholder="view token" autocomplete="off">
  <button id="go">Watch the crew</button>
</div>
<div id="app" hidden>
  <header>
    <div class="logo"><span class="ghost" style="background:#7b4fc0"></span>Haunted Crew</div>
    <span class="stat"><span class="conn" id="conn"></span><span id="connText">connecting…</span></span>
    <div class="stats">
      <span class="stat"><b id="sOn">0</b> on shift</span>
      <span class="stat"><b id="sWork">0</b> working</span>
      <span class="stat"><b id="sWait">0</b> waiting</span>
      <span class="stat"><b id="sErr">0</b> errors</span>
    </div>
  </header>
  <main>
    <section><h2>CREW</h2><div class="scroll" id="crew"></div></section>
    <section><h2 id="feedTitle">LIVE ACTIVITY · everyone</h2><div class="scroll feed" id="feed"></div></section>
    <section><h2>NEEDS YOU · TASKS</h2><div class="scroll" id="side"></div></section>
  </main>
</div>
<script>
'use strict';
// Read-only view of the bridge stream. The view token lives in the URL fragment, which browsers never send to servers.
const JOBS = [['plan', '#7b4fc0'], ['spec', '#7b4fc0'], ['lead', '#7b4fc0'], ['test', '#3fa9de'], ['qa', '#3fa9de'], ['review', '#8b5e3c'],
  ['doc', '#d04848'], ['writ', '#d04848'], ['research', '#c8a165'], ['search', '#c8a165'], ['cod', '#e0b020'], ['dev', '#e0b020'], ['build', '#e0b020']];
const STATUS = { working: 'var(--work)', waiting: 'var(--warn)', error: 'var(--bad)', idle: 'var(--faint)' };
const NAMES = ['#9cc4ff', '#ffc08a', '#a6eba0', '#f0a8e8', '#8aebdf', '#ffe38a', '#cdb4ff'];
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const jobColor = (n) => (JOBS.find(([k]) => String(n ?? '').toLowerCase().includes(k)) || [0, '#7a7090'])[1];
const nameColor = (n) => { let h = 0; for (const c of String(n)) h = (h * 31 + c.charCodeAt(0)) | 0; return NAMES[Math.abs(h) % NAMES.length]; };
const label = (s) => s.agent || `Ghost ${String(s.session).slice(0, 6)}`;

let sessions = new Map();
let history = [];
let selected = null;

function activity(s) {
  if (s.status === 'waiting') return s.permission ? 'needs your approval' : 'waiting for you';
  if (s.status === 'error') return 'hit an error';
  if (s.status === 'idle') return 'idle';
  const where = s.file ? ' ' + s.file : '';
  if (s.lastKind === 'prompt') return 'thinking';
  const acts = { read: 'reading' + where, write: 'writing' + where, shell: 'running a command', web: 'searching the web', mcp: 'using a tool', subagent: 'calling a helper', spec: 'updating the spec' };
  return acts[s.category] || 'working';
}

function lineText(e) {
  const where = e.file ? ' ' + e.file : '';
  switch (e.kind) {
    case 'session_start': return 'joined the crew';
    case 'session_end': return 'left the crew';
    case 'prompt': return e.text ? '▶ ' + e.text : 'got a new prompt';
    case 'tool_start': return !e.file && e.tool ? e.tool : (e.category === 'write' ? 'writing' : e.category === 'read' ? 'reading' : e.category === 'shell' ? 'running a command' : e.tool || 'working') + where;
    case 'tool_end': return e.ok === false ? `✖ ${e.tool || 'a tool'} failed` : null;
    case 'file_create': return 'created' + where;
    case 'file_save': return 'edited' + where;
    case 'file_delete': return 'deleted' + where;
    case 'task_start': return 'started task: ' + (e.task || '?');
    case 'task_end': return '✔ finished task: ' + (e.task || '?');
    case 'message': return e.text;
    case 'permission': return '⚠ asked to ' + (e.request?.title || 'use a tool');
    case 'permission_resolved': return e.text;
    case 'stop': return 'finished';
    case 'error': return '✖ error: ' + (e.text || 'unknown');
    default: return null;
  }
}

const time = (ts) => ts ? new Date(ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';

function render() {
  const all = [...sessions.values()];
  $('sOn').textContent = all.length;
  $('sWork').textContent = all.filter((s) => s.status === 'working').length;
  $('sWait').textContent = all.filter((s) => s.status === 'waiting').length;
  $('sErr').textContent = all.filter((s) => s.status === 'error').length;

  $('crew').innerHTML = (all.length ? '' : '<div class="empty">No ghosts yet. Summon one from the Minecraft console (K) or start a Kiro session.</div>') +
    `<div class="crew ${selected === null ? 'sel' : ''}" data-id=""><span class="ghost" style="background:#2c2244"></span><div><div class="name"># crew</div><div class="act">${all.length} ghosts</div></div></div>` +
    all.map((s) => `<div class="crew ${selected === s.session ? 'sel' : ''}" data-id="${esc(s.session)}">
      <span class="ghost" style="background:${jobColor(label(s))}"></span>
      <div><div class="name">${esc(label(s))}${s.console ? '' : ' <span style="color:var(--faint)">· IDE</span>'}</div><div class="act">${esc(activity(s))}</div></div>
      <span class="dot" style="background:${STATUS[s.status] || 'var(--faint)'}"></span></div>`).join('');

  const rows = history.filter((e) => selected === null || e.session === selected).map((e) => [e, lineText(e)]).filter(([, t]) => t);
  const feed = $('feed');
  const atBottom = feed.scrollHeight - feed.scrollTop - feed.clientHeight < 40;
  feed.innerHTML = rows.length ? rows.slice(-300).map(([e, t]) => {
    const who = e.agent || label(sessions.get(e.session) || { session: e.session });
    const cls = 'k-' + (e.kind === 'tool_end' ? 'fail' : e.kind);
    return `<div class="row ${cls}"><span class="time">${time(e.ts)}</span><span class="who" style="color:${nameColor(who)}">${esc(who)}</span><span class="msg">${esc(t)}</span></div>`;
  }).join('') : '<div class="empty">Waiting for activity…</div>';
  if (atBottom) feed.scrollTop = feed.scrollHeight;
  $('feedTitle').textContent = 'LIVE ACTIVITY · ' + (selected === null ? 'everyone' : label(sessions.get(selected) || { session: selected }));

  const needs = all.filter((s) => s.permission);
  const tasks = new Map();
  for (const e of history) {
    if (e.kind === 'task_start' && e.task) tasks.set(e.task, false);
    if (e.kind === 'task_end' && e.task) tasks.set(e.task, true);
  }
  $('side').innerHTML =
    (needs.length ? needs.map((s) => `<div class="card need"><b style="color:var(--warn)">⚠ ${esc(label(s))}</b><br>wants to: ${esc(s.permission.title)}<br><span style="color:var(--dim)">Answer in Minecraft (K)</span></div>`).join('')
      : '<div class="card" style="color:var(--dim)">Nobody needs you right now.</div>') +
    `<div class="card tasks"><b>Spec tasks</b><ul>${tasks.size ? [...tasks].map(([t, d]) => `<li class="${d ? 'done' : ''}">${d ? '✔' : '○'} ${esc(t)}</li>`).join('') : '<li>Kiro spec tasks show up here as agents run them.</li>'}</ul></div>`;
}

$('crew').addEventListener('click', (ev) => {
  const el = ev.target.closest('.crew');
  if (!el) return;
  selected = el.dataset.id || null;
  render();
});

function connect(token) {
  $('app').hidden = false;
  $('auth').hidden = true;
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const ws = new WebSocket(`${proto}://${location.host}/stream?token=${encodeURIComponent(token)}`);
  const status = (text, color) => { $('connText').textContent = text; $('conn').style.background = color; };
  ws.onopen = () => status('live', 'var(--ok)');
  ws.onmessage = (m) => {
    const msg = JSON.parse(m.data);
    if (msg.type === 'hello') {
      sessions = new Map(msg.sessions.map((s) => [s.session, s]));
      history = msg.history;
    } else if (msg.type === 'event') {
      history.push(msg.event);
      if (history.length > 1000) history.splice(0, history.length - 1000);
      if (msg.event.kind === 'session_end') sessions.delete(msg.event.session);
      else if (msg.session) sessions.set(msg.session.session, msg.session);
    }
    render();
  };
  ws.onclose = (ev) => {
    if (ev.code === 1006 && !sessions.size && !history.length) {
      status('wrong token?', 'var(--bad)');
    } else {
      status('reconnecting…', 'var(--warn)');
    }
    setTimeout(() => connect(token), 2000);
  };
}

const token = new URLSearchParams(location.hash.slice(1)).get('token') || sessionStorage.getItem('hc-token');
if (token) {
  sessionStorage.setItem('hc-token', token);
  connect(token);
} else {
  $('auth').hidden = false;
  $('go').onclick = () => {
    const v = $('tok').value.trim();
    const t = v.includes('token=') ? new URLSearchParams(v.split('#')[1] || '').get('token') : v;
    if (!t) return;
    sessionStorage.setItem('hc-token', t);
    connect(t);
  };
}
render();
</script>
</body>
</html>
